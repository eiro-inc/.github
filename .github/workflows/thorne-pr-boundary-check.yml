name: Thorne PR Boundary Check

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-body:
    name: Validate Thorne PR boundary declarations
    runs-on: ubuntu-latest
    steps:
      # Delegates to the composite action, which carries the extracted,
      # unit-tested validator (.github/actions/thorne-pr-boundary-check).
      # Referencing it by path auto-fetches the action's files; no checkout.
      - name: Validate PR template sections
        uses: eiro-inc/.github/.github/actions/thorne-pr-boundary-check@main
