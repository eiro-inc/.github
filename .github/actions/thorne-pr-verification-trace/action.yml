name: Thorne PR Verification-Traceability Check
description: >-
  Validate @verifies SRS-NN-MM tags and implements: SDD-NN declarations in the
  source under review against the controlled DHF, using the vvtrace engine
  (ADR-0008; #113 AC1-2, the @verifies/SRS-ID lint). Read-only: it validates and
  fails the job on any unknown id or malformed tag. It never writes the DHF or
  the TRM.

inputs:
  src:
    description: "Path to the already-checked-out source tree to scan."
    required: false
    default: "."
  dhf-repo:
    description: "Controlled DHF repository providing SRS/SDD/IFS/HAZ."
    required: false
    default: "eiro-inc/thorne-dhf"
  dhf-ref:
    description: "Ref of the DHF to validate against."
    required: false
    default: "main"
  vvtrace-ref:
    description: >-
      Released engine tag to install. Pin to a tag (default v0.1.0); do not
      float to a branch — a required gate must not change behavior as a branch
      moves.
    required: false
    default: "v0.1.0"
  token:
    description: >-
      Token with read access to the DHF repo (and to thorne-vv-tooling while it
      is private, for the engine install) — a GitHub App installation token or
      fine-grained PAT. Not persisted to disk and kept off pip's argv / logs.
    required: true

runs:
  using: composite
  steps:
    - name: Check out controlled DHF
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.dhf-repo }}
        ref: ${{ inputs.dhf-ref }}
        token: ${{ inputs.token }}
        path: .thorne-dhf
        persist-credentials: false

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install vvtrace (pinned)
      shell: bash
      env:
        VVTRACE_REF: ${{ inputs.vvtrace-ref }}
        INSTALL_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # Keep the token off pip's argv and out of the logs: write it to a
        # credential-store file git reads transparently, rather than inlining a
        # credential URL. INSTALL_TOKEN is read from env (never a ${{ }}
        # expression in the script), so its value is not echoed.
        printf 'https://x-access-token:%s@github.com\n' "$INSTALL_TOKEN" > "$HOME/.git-credentials"
        trap 'rm -f "$HOME/.git-credentials"' EXIT
        git config --global credential.helper store
        python -m pip install --upgrade pip
        python -m pip install "git+https://github.com/eiro-inc/thorne-vv-tooling@${VVTRACE_REF}"

    - name: "Lint @verifies tags and validate implements: declarations"
      shell: bash
      env:
        SRC: ${{ inputs.src }}
        REPO_NAME: ${{ github.event.repository.name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        vvtrace lint --src "$SRC" --srs .thorne-dhf/02-inputs/SRS.md
        vvtrace implements --repo "$REPO_NAME" --sha "$HEAD_SHA" --src "$SRC" --dhf .thorne-dhf
