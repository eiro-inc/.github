name: Thorne PR Boundary Check
description: Validate Thorne pull-request template boundary declarations (scope, DHF trace, safety class, boundary confirmations).

inputs:
  dependency-check-mode:
    description: >-
      How to treat a changed dependency manifest with no substantive
      "## New Dependencies" declaration: "warn" annotates, "fail" blocks.
      Any other value fails the check (a misconfigured gate is loud, never
      silently lax).
    required: false
    default: warn
  dhf-token:
    description: >-
      Read token for the controlled DHF (and, while it is private, for
      thorne-vv-tooling). Supplying it opts this repository into the DHF Trace
      *existence* check (thorne-dhf#113 AC2): cited SRS/SDD/ARC/IFS/HAZ ids are
      validated against the DHF, not just tested for anchor shape. Omit it and
      the check behaves exactly as before — shape only. Once supplied, a DHF
      that cannot be read fails the check rather than downgrading it.
    required: false
    default: ""
  dhf-repo:
    description: "Controlled DHF repository providing the id namespaces."
    required: false
    default: "eiro-inc/thorne-dhf"
  dhf-ref:
    description: "DHF ref or commit SHA to validate against."
    required: false
    default: "main"
  vvtrace-ref:
    description: >-
      Engine commit to install for the namespace loaders. Defaults to the commit
      tagged v0.1.0. Pin a commit SHA, not a tag or branch — a gate must not
      change behavior as a ref moves, and the engine repo has no tag protection.
    required: false
    default: "6dcf5389ab8fc5a5739d607dbfd4056f82bd9f4e"

runs:
  using: composite
  steps:
    # Everything below the shape check is opt-in and skipped entirely when no
    # dhf-token is supplied, so the default path stays what it has always been:
    # stdlib-only python3, no checkout, no install. This Action runs on every
    # Thorne PR org-wide, so that default matters.
    - uses: actions/setup-python@v5
      if: inputs.dhf-token != ''
      with:
        python-version: "3.12"

    # One step for both token consumers: the scoped GIT_CONFIG_GLOBAL and the
    # credential-cache daemon do not survive a step boundary, and this confines
    # the credential's lifetime to a single step.
    - name: Fetch controlled DHF and install vvtrace (pinned)
      if: inputs.dhf-token != ''
      shell: bash
      env:
        DHF_REPO: ${{ inputs.dhf-repo }}
        DHF_REF: ${{ inputs.dhf-ref }}
        VVTRACE_REF: ${{ inputs.vvtrace-ref }}
        INSTALL_TOKEN: ${{ inputs.dhf-token }}
      run: |
        set -euo pipefail
        # Scope git's global config to a throwaway file for this step only: a
        # composite action shares the caller's job and runner, so writing the
        # real ~/.gitconfig would change credential behavior for every later
        # step and clobber any credential.helper the caller had configured.
        export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/thorne-boundary-gitconfig"
        : > "$GIT_CONFIG_GLOBAL"
        # Token goes to git's in-memory credential cache (a daemon, not a file),
        # so it never lands on pip's argv, in the logs, or on disk. The trap
        # tears the daemon down and drops the config on step exit, success or
        # failure, so it is not retrievable by any later step in the job. The
        # timeout is a backstop only; it covers both network operations below.
        git config --global credential.helper 'cache --timeout=300'
        trap 'git credential-cache exit >/dev/null 2>&1 || true; rm -f "$GIT_CONFIG_GLOBAL"' EXIT
        python -m pip install --upgrade pip
        printf 'protocol=https\nhost=github.com\nusername=x-access-token\npassword=%s\n\n' "$INSTALL_TOKEN" | git credential approve

        # The DHF is only read for its id namespaces; it is never scanned, so
        # unlike thorne-pr-verification-trace there is no scan-tree overlap to
        # avoid. It still goes to $RUNNER_TEMP rather than the workspace, so the
        # checked-out source the caller may be inspecting is left untouched.
        #
        # Setup failure must not abort the Action here: composite steps cannot
        # set continue-on-error, and aborting would surface a raw git/pip error
        # instead of the check's own actionable message. Report and continue —
        # the next step still sets DHF_ROOT, so the script's fail-safe fires and
        # fails the check with an explanation. The gate never passes unverified.
        DHF_DIR="$RUNNER_TEMP/thorne-dhf"
        rm -rf "$DHF_DIR"
        rc=0
        {
          git init -q "$DHF_DIR" \
            && git -C "$DHF_DIR" remote add origin "https://github.com/$DHF_REPO" \
            && git -C "$DHF_DIR" fetch -q --depth 1 origin "$DHF_REF" \
            && git -C "$DHF_DIR" checkout -q FETCH_HEAD \
            && python -m pip install "git+https://github.com/eiro-inc/thorne-vv-tooling@${VVTRACE_REF}"
        } || rc=1
        if [ "$rc" -ne 0 ]; then
          echo "::warning::Could not fetch the DHF or install the vvtrace engine; the boundary check will fail with details rather than skip the existence check."
        fi

    - name: Validate PR template sections
      shell: bash
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_ACTOR: ${{ github.actor }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        DEPENDENCY_CHECK_MODE: ${{ inputs.dependency-check-mode }}
        DHF_ENABLED: ${{ inputs.dhf-token != '' }}
      run: |
        set -euo pipefail
        # DHF_ROOT is what switches the script into existence-checking. Set it
        # only when the caller opted in — and set it even if the fetch above
        # failed, so the script's fail-safe reports an unreadable DHF instead of
        # quietly falling back to the shape-only check.
        if [ "$DHF_ENABLED" = "true" ]; then
          export DHF_ROOT="$RUNNER_TEMP/thorne-dhf"
        fi
        python3 "${GITHUB_ACTION_PATH}/thorne_pr_boundary_check.py"
