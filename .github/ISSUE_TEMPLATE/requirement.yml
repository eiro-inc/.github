name: Software Requirement
description: Define a new software requirement for traceability
title: "[REQ] "
labels: ["requirement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Software Requirement
        Use this template to document software requirements per SOP-004.
        Each requirement will be assigned a unique identifier (the GitHub issue number).

  - type: input
    id: user-need
    attributes:
      label: Related User Need(s)
      description: Reference the User Need ID(s) this requirement traces to (e.g., UN-001, UN-003)
      placeholder: "UN-001"
    validations:
      required: true

  - type: textarea
    id: requirement
    attributes:
      label: Requirement Statement
      description: Clear, unambiguous statement of what the software SHALL do
      placeholder: "The system shall..."
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Requirement Type
      options:
        - Functional
        - Performance
        - Security
        - Usability
        - Interface
        - Regulatory
        - AI/ML
    validations:
      required: true

  - type: dropdown
    id: safety-impact
    attributes:
      label: Safety Impact
      description: Does this requirement relate to safety-critical functionality?
      options:
        - "No - Not safety related"
        - "Yes - Safety related (Class B)"
        - "Yes - Safety critical (Class C)"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will this requirement be verified? What constitutes successful implementation?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: verification-method
    attributes:
      label: Verification Method
      options:
        - Test
        - Inspection
        - Analysis
        - Demonstration
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any additional context, constraints, or considerations
    validations:
      required: false
